[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PROJECT_NAME"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["PROJECT_PACKAGE*"]
